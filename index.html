<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Valuta Cash</title></head><body><div class="app"><header><div><b>Valuta Cash</b><small>Калькулятор обмена валют</small></div></header><nav><button class="tab active" data-tab="online">Онлайн курс</button><button class="tab" data-tab="manual">Мой курс</button></nav><main><section id="online" class="panel active"><div class="card"><label>Меняю</label><div class="row"><input id="amount" type="number" value="100"><select id="from"></select></div><button id="swap">⇅</button><label>Получаю</label><div class="row result"><strong id="result">—</strong><select id="to"></select></div><div class="modes"><button id="buy" class="active">Я продаю валюту</button><button id="sell">Я покупаю валюту</button></div><small id="note"></small></div><div class="card"><div class="head"><b>Источник курса</b><select id="source"><option value="deghest">DEGHEST Центр</option><option value="maib">maib</option><option value="bnm">BNM</option></select></div><small id="updated"></small><div id="rates"></div></div></section><section id="manual" class="panel"><div class="card"><h2>Мой курс</h2><small>Задай любой курс вручную — результат пересчитается сразу.</small><label>Сумма</label><div class="row"><input id="ma" type="number" value="100"><select id="mf"></select></div><div class="manual"><label>Курс: 1 <span id="mfl"></span> =</label><input id="mr" type="number" value="20.50"><span id="mtl"></span></div><label>Получаю</label><div class="row result"><strong id="mres">—</strong><select id="mt"></select></div><div class="quick"><button data-r="20">20</button><button data-r="20.25">20.25</button><button data-r="20.50">20.50</button><button data-r="21">21</button><button data-r="22">22</button></div></div></section></main><footer>Valuta Cash v2 · курс может отличаться в конкретной кассе.</footer></div><script src="app.js"></script></body></html>
